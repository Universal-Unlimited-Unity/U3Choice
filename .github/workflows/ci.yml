name: U3Choice CI

on:
  push:
    branches:
      - main

jobs:

  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: ./backend
        run: pip install -r requirements.txt

      - name: Load env
        run: cat .github/workflows/.env.test >> "$GITHUB_ENV"

      - name: Start containers
        run: docker compose up -d --wait database redis

      - name: Run tests
        working-directory: ./backend
        env:
          PYTHONPATH: .
        run: pytest -v

  deploy:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.AZURE_SSH_PRIVATE_KEY }}" > ~/.ssh/azure_vm
          chmod 600 ~/.ssh/azure_vm

      - name: Deploy to Azure VM
        run: |
          ssh -i ~/.ssh/azure_vm \
            -o StrictHostKeyChecking=no \
            u3choice@${{ secrets.AZURE_VM_IP }} << 'EOF'

            cd ~/U3Choice

            git pull origin main

            sudo docker compose down

            sudo docker compose up -d --build

          EOF